<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كيدز آريا</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="kids.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light p-3" style="background-color: #fff9fb;">
        <div class="container-fluid">
            <a href="#" class="logo">
                <img src="logo.png.jpg" alt="logo.beit">
            </a>
            <a href="events.html" class="navbar-brand fw-bold"><button class="btn-btn">المناسبات</button></a>
            <a href="kids.html" class="navbar-brand fw-bold"><button class="btn-btn">الكيدز آريا</button></a>
            <a href="index.html" class="navbar-brand fw-bold"><button class="btn-btn">الكافيه</button></a>

            <div class="w-100 d-flex justify-content-center align-items-center">
                <span class="navbar-brand  fw-bolder h1" style="color: #ff477e;">بيت جدو</span>
            </div>
        </div>
    </nav>
    <div class="container-fluid bg-primary-custom min-vh-100 d-flex align-items-center justify-content-center">
        <div class="container py-3 px-4 rounded" style="background-color: #fff9fb;" dir="ltr">
            <h3 class="mt-4 align-content-center justify-content-center text-center fw-bold">إحجز مناسبتك الأن</h3>
            <form>
                <div class="mb-3 col-md-6 mx-auto" dir="rtl">
                    <label for="Name" d-flex class="form-label fw-bold " d-flex>الأسم</label>
                    <input type="name" class="form-control fw-semibold" id="Name" placeholder="إسم صاحب الحجز">
                </div>
                <div class="mb-3 col-md-6 mx-auto" dir="rtl">
                    <label for="Telephone" class="form-label fw-bold">رقم التليفون</label>
                    <input type="tel" class="form-control fw-semibold" dir="rtl" id="tel" placeholder="10*****">
                </div>
                <div class="mb-3 col-md-6 mx-auto" dir="rtl">
                    <label for="Date" d-flex class="form-label fw-bold" d-flex>موعد المناسبة</label>
                    <input type="date" class="form-control fw-semibold" dir="rtl" id="Date">
                </div>
                <div class="mb-3 col-md-6 mx-auto" dir="rtl">
                    <label for="Number" d-flex class="form-label fw-bold" d-flex>عدد الأفراد</label>
                    <input type="number" class="form-control fw-semibold" id="Number" placeholder="20 فرد مثلاً">
                </div>
                <div class="mb-3 col-md-6 mx-auto" dir="rtl">
                    <label for="Event" d-flex class="form-label fw-bold" d-flex>نوع المناسبة</label>
                    <input type="event" class="form-control fw-semibold" id="Event" placeholder="عيد ميلاد,خطوبة,....">
                </div>
                <div class="mb-3 col-md-6 mx-auto" dir="rtl">
                    <label for="Feedback" d-flex class="form-label fw-bold" d-flex>ملاحظات إضافية</label>
                    <input type="feedback" class="form-control fw-semibold" id="Feedback" placeholder="أى تفاصيل تود إضافتها....">
                </div>

                <div class="text-center">

                <button type="submit" class="btn fw-bold w-25" style="background-color: #ff477e;">تأكيد الحجز</button>

                </div>

        </div>
    </div>
    </form>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
